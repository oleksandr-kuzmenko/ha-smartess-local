[project]
name = "home-assistant-smartess-local"
version = "0.1.0"
description = "Local Home Assistant monitoring for Aninerel / ANENJI and other compatible SmartESS inverters"
keywords = ["home-assistant", "smartess", "aninerel", "anenji", "eybond", "inverter", "local"]
requires-python = ">=3.14.2"
dependencies = [
  "smartess-local @ https://github.com/oleksandr-kuzmenko/smartess-local/archive/7867beca9460b5e1cba098b446bc4a3424655089.zip",
]

[dependency-groups]
dev = ["homeassistant==2026.10.0", "pytest-homeassistant-custom-component==0.13.371", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
